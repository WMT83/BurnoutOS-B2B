<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BurnoutOS Corporate Programme — South Africa · October 2026</title>
  <meta name="description" content="A 10-week burnout recovery programme for senior staff and high performers. 2-day in-person intensive plus 8-week structured integration. Invoiced, PO-ready, tiered team rates." />
  <link rel="canonical" href="https://burnout-os.app/tour/corporate" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ember:      #e84b2a;
      --ember-dim:  #c73d20;
      --ember-glow: rgba(232,75,42,0.15);
      --violet:     #7c3aed;
      --violet-soft:#a78bfa;
      --teal:       #1a6b72;
      --teal-soft:  #4db8c0;
      --indigo:     #312e81;
      --ink:        #0c1018;
      --ink-soft:   #1c1920;
      --ink-muted:  #5a6480;
      --warm:       #f5f0e8;
      --white:      #ffffff;
      --rule:       rgba(255,255,255,0.1);
      --rule-soft:  rgba(255,255,255,0.07);
      --muted:      rgba(255,255,255,0.55);
      --faint:      rgba(255,255,255,0.3);
      --gold:       #c9a96e;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--ink);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.4;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(13,13,20,0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--rule);
    }
    .nav-back {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.875rem;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--white); }
    .nav-back .arrow { font-family: 'Syne', sans-serif; }
    .nav-right { display: flex; align-items: center; gap: 1.25rem; }
    .nav-switch {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-switch:hover { color: var(--ember); }
    .seats-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 100px;
      background: var(--ember-glow);
      color: var(--ember);
      border: 1px solid rgba(232,75,42,0.3);
    }
    .nav-cta {
      font-size: 0.875rem;
      font-weight: 600;
      font-family: 'Syne', sans-serif;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      background: var(--ember);
      color: var(--white);
      text-decoration: none;
      transition: background 0.2s;
    }
    .nav-cta:hover { background: var(--ember-dim); }
    @media (max-width: 720px) {
      .nav-switch { display: none; }
    }

    /* ── LAYOUT ── */
    section { padding: 6rem 2rem; position: relative; }
    .inner    { max-width: 1100px; margin: 0 auto; }
    .inner-md { max-width: 900px; margin: 0 auto; }
    .inner-sm { max-width: 720px; margin: 0 auto; }
    .inner-xs { max-width: 560px; margin: 0 auto; }

    /* ── EYEBROW ── */
    .eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ember);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .eyebrow.center { justify-content: center; }
    .eyebrow.muted { color: var(--muted); }
    .eyebrow .rule { display: inline-block; width: 20px; height: 1px; background: currentColor; }

    h1, h2, h3, h4 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .section-h {
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    .body-text {
      color: var(--muted);
      font-size: 1.0625rem;
      line-height: 1.75;
      font-weight: 300;
    }
    .body-text + .body-text { margin-top: 1.25rem; }
    .body-text strong { color: var(--white); font-weight: 500; }

    /* ── HERO ── */
    #hero {
      padding-top: 9rem;
      padding-bottom: 5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    #hero::before {
      content: '';
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse at center, rgba(232,75,42,0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    #hero::after {
      content: '';
      position: absolute;
      bottom: -100px; right: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(ellipse at center, rgba(124,58,237,0.12) 0%, transparent 60%);
      pointer-events: none;
    }
    #hero .inner-md { position: relative; z-index: 1; }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      border-radius: 100px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--rule);
      font-size: 0.78rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 1.75rem;
    }
    .hero-badge .pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--ember);
      box-shadow: 0 0 0 0 rgba(232,75,42,0.6);
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(232,75,42,0.55); }
      70%  { box-shadow: 0 0 0 10px rgba(232,75,42,0); }
      100% { box-shadow: 0 0 0 0 rgba(232,75,42,0); }
    }

    #hero h1 {
      font-size: clamp(2.4rem, 5.5vw, 4.2rem);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.025em;
      margin-bottom: 1.5rem;
      max-width: 22ch;
      margin-inline: auto;
    }
    #hero h1 em {
      font-style: normal;
      color: var(--ember);
    }
    .hero-lede {
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      max-width: 60ch;
      margin: 0 auto 2.5rem;
      font-weight: 300;
    }

    .hero-cta {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3.5rem;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1rem 2rem;
      border-radius: 12px;
      background: var(--ember);
      color: var(--white);
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      cursor: pointer;
      border: none;
    }
    .btn-primary:hover { background: var(--ember-dim); transform: translateY(-2px); }
    .btn-primary .arrow { transition: transform 0.2s; }
    .btn-primary:hover .arrow { transform: translateX(3px); }
    .btn-ghost {
      display: inline-block;
      padding: 1rem 2rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.65);
      font-weight: 500;
      font-size: 1rem;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.28); color: var(--white); }

    /* ── STAT STRIP ── */
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
      max-width: 780px;
      margin: 0 auto;
      padding-top: 2.25rem;
      border-top: 1px solid var(--rule);
    }
    @media (min-width: 720px) {
      .stat-strip { grid-template-columns: repeat(4, 1fr); }
    }
    .stat {
      text-align: center;
      padding: 0.5rem 1rem;
      border-right: 1px solid var(--rule-soft);
    }
    .stat:last-child, .stat:nth-child(2):last-child { border-right: none; }
    @media (max-width: 719px) {
      .stat:nth-child(2) { border-right: none; }
      .stat:nth-child(3), .stat:nth-child(4) {
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--rule-soft);
      }
    }
    @media (min-width: 720px) {
      .stat:nth-child(4) { border-right: none; }
    }
    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.4rem, 2.2vw, 1.8rem);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .stat-num .unit {
      color: var(--ember);
      font-size: 0.65em;
      margin-left: 0.1em;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ── FORMAT BANNER ── */
    .format-banner {
      padding: 1.25rem 2rem;
      background: rgba(124,58,237,0.08);
      border-top: 1px solid rgba(124,58,237,0.2);
      border-bottom: 1px solid rgba(124,58,237,0.2);
    }
    .format-banner .inner {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      font-size: 0.92rem;
    }
    .format-banner .txt { color: rgba(255,255,255,0.7); }
    .format-banner .txt strong { color: var(--white); font-weight: 600; }
    .format-banner a {
      color: var(--violet-soft);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid rgba(167,139,250,0.3);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .format-banner a:hover { color: var(--white); border-bottom-color: var(--white); }

    /* ── RECOGNITION ── */
    #recognition {
      background: linear-gradient(180deg, transparent, rgba(49,46,129,0.08));
    }
    .recognition-split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      margin-top: 2.5rem;
    }
    @media (min-width: 880px) {
      .recognition-split { grid-template-columns: 1fr 1fr; gap: 3rem; }
    }

    /* ── OUTCOMES ── */
    #outcomes {
      background: var(--ink-soft);
      position: relative;
      overflow: hidden;
    }
    #outcomes::before {
      content: '';
      position: absolute;
      top: 10%; left: -10%;
      width: 50%; height: 60%;
      background: radial-gradient(ellipse at center, rgba(232,75,42,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    #outcomes::after {
      content: '';
      position: absolute;
      bottom: 0; right: -10%;
      width: 50%; height: 60%;
      background: radial-gradient(ellipse at center, rgba(124,58,237,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    #outcomes .inner { position: relative; z-index: 1; }
    .outcome-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-top: 3rem;
    }
    @media (min-width: 880px) { .outcome-grid { grid-template-columns: repeat(3, 1fr); } }
    .outcome-card {
      padding: 1.75rem;
      border-radius: 12px;
      border: 1px solid var(--rule);
      background: rgba(255,255,255,0.025);
    }
    .outcome-tag {
      font-family: 'Syne', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ember);
      margin-bottom: 1rem;
      font-weight: 700;
    }
    .outcome-card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.65rem;
      letter-spacing: -0.01em;
    }
    .outcome-card p {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.65;
      font-weight: 300;
    }

    /* ── CURRICULUM (the weekend) ── */
    #curriculum { background: var(--ink); }
    .day-block { margin-top: 3.5rem; }
    .day-block:first-of-type { margin-top: 3rem; }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--rule);
      gap: 1rem;
      flex-wrap: wrap;
    }
    .day-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.35rem, 2.2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: -0.015em;
    }
    .day-meta {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    .session-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 700px) { .session-grid { grid-template-columns: 1fr 1fr; } }
    .session {
      padding: 1.5rem 1.5rem 1.4rem;
      border-radius: 12px;
      border: 1px solid var(--rule);
      background: rgba(255,255,255,0.02);
      transition: border-color 0.25s, transform 0.25s, background 0.25s;
    }
    .session:hover {
      border-color: rgba(232,75,42,0.4);
      transform: translateY(-2px);
      background: rgba(255,255,255,0.035);
    }
    .session-num {
      display: inline-block;
      font-family: 'Syne', sans-serif;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ember);
      margin-bottom: 0.65rem;
    }
    .session h3 {
      font-size: 1.08rem;
      font-weight: 600;
      margin-bottom: 0.55rem;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .session p {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      font-weight: 300;
    }

    /* ── INTEGRATION PHASE ── */
    #integration {
      background: var(--ink-soft);
      position: relative;
    }
    #integration::before {
      content: '';
      position: absolute;
      top: 10%; right: -5%;
      width: 35%; height: 45%;
      background: radial-gradient(ellipse at center, rgba(232,75,42,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    #integration .inner { position: relative; z-index: 1; }
    .integration-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-top: 3rem;
    }
    @media (min-width: 700px) { .integration-grid { grid-template-columns: 1fr 1fr; } }

    .week-card {
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--rule);
      background: rgba(255,255,255,0.025);
      transition: border-color 0.25s, transform 0.25s;
      position: relative;
    }
    .week-card:hover { border-color: rgba(232,75,42,0.35); transform: translateY(-2px); }
    .week-card.has-call {
      border-color: rgba(232,75,42,0.4);
      background: linear-gradient(135deg, rgba(232,75,42,0.06) 0%, rgba(255,255,255,0.025) 60%);
    }
    .week-num {
      display: inline-block;
      font-family: 'Syne', sans-serif;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ember);
      margin-bottom: 0.55rem;
    }
    .week-call-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--ember);
      color: var(--white);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 100px;
      margin-left: 0.5rem;
      vertical-align: 1px;
    }
    .week-call-tag::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--white);
    }
    .week-card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.55rem;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .week-card p {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      font-weight: 300;
    }
    .week-card p strong { color: var(--white); font-weight: 500; }

    .phase-callout {
      margin-top: 2.25rem;
      padding: 1.75rem 2rem;
      border-radius: 12px;
      border: 1px solid rgba(232,75,42,0.25);
      background: linear-gradient(135deg, rgba(232,75,42,0.08) 0%, rgba(124,58,237,0.06) 100%);
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 720px) { .phase-callout { grid-template-columns: 1fr 1fr; gap: 2rem; } }
    .phase-callout .label {
      font-family: 'Syne', sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ember);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .phase-callout h4 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.45rem;
      letter-spacing: -0.01em;
    }
    .phase-callout p {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      font-weight: 300;
    }

    /* ── FORMAT (how the 10 weeks fit together) ── */
    #format { background: var(--ink); }
    .format-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-top: 3rem;
    }
    @media (min-width: 880px) { .format-grid { grid-template-columns: repeat(3, 1fr); } }
    .format-card {
      padding: 1.75rem;
      border-radius: 12px;
      border: 1px solid var(--rule);
      background: rgba(255,255,255,0.025);
    }
    .format-step {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--ember);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .format-card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      letter-spacing: -0.01em;
    }
    .format-card p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
      font-weight: 300;
    }

    /* ── VALUE STACK ── */
    #stack {
      background: var(--ink-soft);
      position: relative;
    }
    #stack::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,75,42,0.4), transparent);
    }
    .stack-rows {
      max-width: 880px;
      margin: 2.5rem auto 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .stack-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.6rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--rule-soft);
    }
    @media (min-width: 720px) {
      .stack-row { grid-template-columns: 1fr auto; gap: 2rem; align-items: start; }
    }
    .stack-row:last-child { border-bottom: none; }
    .stack-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ember);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .stack-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 0.4rem;
    }
    .stack-desc {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.6;
      font-weight: 300;
      max-width: 56ch;
    }
    .stack-value {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--white);
      letter-spacing: -0.015em;
      white-space: nowrap;
    }
    .stack-value .unit {
      display: block;
      margin-top: 0.25rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;

<!-- RECOGNITION -->
<section id="recognition">
  <div class="inner-md">
    <div class="eyebrow reveal"><span class="rule"></span>Why this matters commercially</div>
    <h2 class="section-h reveal">The senior people most likely to leave are the ones least likely to ask for help.</h2>
    <p class="body-text reveal">Burnout among senior staff and high performers is a retention risk before it's a wellbeing risk. By the time it shows up on an engagement survey, the resignation has already been emotionally written. The intervention that changes outcomes is the one that arrives early enough, structured enough, and credible enough that the person actually engages with it.</p>

    <div class="recognition-split">
      <div class="reveal">
        <p class="body-text"><strong>Most corporate wellbeing offerings underperform with senior staff.</strong> EAP referrals carry stigma. Generic resilience workshops insult the audience. Coaching engagements are slow to set up and inconsistent in clinical depth. The people you most want to support are the people for whom the existing options don't fit.</p>
        <p class="body-text">This programme is different in three specific ways. It's clinically led by a dual-registered psychologist, which gives it the credibility senior people require. It's contained — a defined 10-week arc, not an open-ended commitment. And it sits outside the EAP pathway entirely, which removes the stigma barrier that suppresses uptake.</p>
      </div>
      <div class="reveal">
        <p class="body-text"><strong>The structure makes it stick.</strong> A 2-day in-person intensive is the kickoff that gets attention and creates real change. The 8-week integration phase that follows is what makes sure the change embeds rather than fading after the initial momentum.</p>
        <p class="body-text">Two facilitated cohort calls during the integration phase keep accountability live. AI-supported daily check-ins keep the work warm. The relapse prevention plan that emerges in Week 8 gets reviewed by the clinical lead and becomes something your person genuinely uses, not a document that disappears after the workshop.</p>
      </div>
    </div>
  </div>
</section>

<!-- THE WEEKEND CURRICULUM -->
<section id="curriculum">

    <h2 class="section-h reveal">Eight sessions delivered across two in-person days.</h2>
    <p class="body-text reveal">The full curriculum content lives here — every framework, every tool, every technique. By Sunday evening you have the toolkit. The 8 weeks that follow are where it gets embedded.</p>

    <div class="day-block">
      <div class="day-header reveal">
        <div class="day-title">Day 1 · Foundations</div>
        <div class="day-meta">Sessions 1 to 4 · Saturday</div>
      </div>
      <div class="session-grid">
        <div class="session reveal">
          <div class="session-num">Session 01</div>
          <h3>The Neuroscience of Burnout</h3>
          <p>Why your brain got here, and what it takes to heal. Understand the biology driving your exhaustion. Map your recovery starting point against the OLBI baseline you completed before arriving.</p>
        </div>
        <div class="session reveal">
          <div class="session-num">Session 02</div>
          <h3>Trying Harder Is Making It Worse</h3>
          <p>The exhaustion trap that keeps high performers stuck. Why the strategies that got you here can't get you out, and what genuinely shifts the pattern.</p>
        </div>
        <div class="session reveal">
          <div class="session-num">Session 03</div>
          <h3>How to Stop the 3am Spiral</h3>
          <p>Breaking the rumination loop that steals your rest. Practical defusion and present-moment techniques for the moments when your mind won't let go.</p>
        </div>
        <div class="session reveal">
          <div class="session-num">Session 04</div>
          <h3>How to Reset Your Sleep</h3>
          <p>The science of nervous system recovery after burnout. Sleep window calibration, stimulus control, and wind-down protocols that actually work when you're depleted.</p>
        </div>
      </div>
    </div>

    <div class="day-block">
      <div class="day-header reveal">
        <div class="day-title">Day 2 · Integration</div>
        <div class="day-meta">Sessions 5 to 8 · Sunday</div>
      </div>

        <div class="session reveal">
          <div class="session-num">Session 05</div>
          <h3>Pivoting Towards Meaning in Work</h3>

        </div>
